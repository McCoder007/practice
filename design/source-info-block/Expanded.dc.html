<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #7c3aed; }
    a:hover { color: #6d28d9; }
  </style>
</helmet>

<div style="width: 390px; min-height: 420px; background: #f7f7f8; font-family: 'Inter', system-ui, sans-serif; padding: 24px 20px;">

  <!-- Expanded disclosure -->
  <div style="background: #ffffff; border: 1px solid #e4e4e7; border-radius: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.04);">
    <div style="width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px;">
      <span style="display: flex; align-items: center; gap: 10px;">
        <span style="width: 28px; height: 28px; border-radius: 999px; background: #f4f4f5; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#71717a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16.5"/><circle cx="12" cy="8" r="0.9" fill="#71717a" stroke="none"/></svg>
        </span>
        <span style="font-weight: 600; font-size: 15px; color: #18181b;">Source information <span style="color: #a1a1aa; font-weight: 500;">|</span> 来源说明</span>
      </span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#71717a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg>
    </div>

    <div style="border-top: 1px solid #f0f0f1; padding: 14px 16px 16px; padding-left: 54px;">
      <p style="margin: 0; font-size: 13.5px; color: #52525b; line-height: 1.5;">
        Official Practice pool — 100 questions drawn from the state board's published exam blueprint.
      </p>

      <a href="#" style="margin-top: 10px; display: inline-flex; align-items: center; gap: 5px; font-size: 13.5px; font-weight: 600; color: #7c3aed; text-decoration: none;">
        Original <span style="color: #c4b5fd; font-weight: 500;">/</span> 原文
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M8 7h9v9"/></svg>
      </a>

      <div style="margin-top: 14px; padding-top: 14px; border-top: 1px solid #f0f0f1;">
        <p style="margin: 0; font-size: 12.5px; color: #a1a1aa; line-height: 1.5;">
          Practice history stays in this browser only.<br>练习记录仅保存在此浏览器中。
        </p>
        <button type="button" style="margin-top: 10px; display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 8px; border: 1px solid #fecdd3; background: #fff1f2; color: #be123c; font-size: 13px; font-weight: 600;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#be123c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6h16Z"/></svg>
          Clear this bank's history <span style="color: #fb7185; font-weight: 500;">|</span> 清除此题库记录
        </button>
      </div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
