":\"甲半月\",\"partOfSpeech\":\"Noun\",\"example\":\"The lunula is the whitish half-moon at the nail base.\",\"exampleTranslation\":\"甲半月是指甲根部发白的半月形。\"},{\"id\":\"anatomy-physiology-cuticle\",\"word\":\"cuticle\",\"sayIt\":\"KYOO-tih-kul\",\"translation\":\"甲小皮\",\"partOfSpeech\":\"Noun\",\"example\":\"The cuticle is dead, colorless tissue stuck to the nail plate.\",\"exampleTranslation\":\"甲小皮是粘在甲板上、无色的死组织。\"},{\"id\":\"anatomy-physiology-eponychium\",\"word\":\"eponychium\",\"sayIt\":\"ep-oh-NIK-ee-um\",\"translation\":\"甲上皮\",\"partOfSpeech\":\"Noun\",\"example\":\"The eponychium is living skin that makes the cuticle.\",\"exampleTranslation\":\"甲上皮是生成甲小皮的活皮肤。\"},{\"id\":\"anatomy-physiology-hyponychium\",\"word\":\"hyponychium\",\"sayIt\":\"hy-poh-NIK-ee-um\",\"translation\":\"甲下皮\",\"partOfSpeech\":\"Noun\",\"example\":\"The hyponychium is skin between the fingertip and the free edge.\",\"exampleTranslation\":\"甲下皮是指尖和游离缘之间的皮肤。\"},{\"id\":\"anatomy-physiology-free-edge\",\"word\":\"free edge\",\"sayIt\":\"$undefined\",\"translation\":\"游离缘\",\"partOfSpeech\":\"Noun\",\"example\":\"The free edge is the part of the nail over the fingertip.\",\"exampleTranslation\":\"游离缘是指甲伸到指尖上方的那一部分。\"},{\"id\":\"anatomy-physiology-nail-bed\",\"word\":\"nail bed\",\"sayIt\":\"$undefined\",\"translation\":\"甲床\",\"partOfSpeech\":\"Noun\",\"example\":\"The nail bed is the living skin under the nail plate.\",\"exampleTranslation\":\"甲床是甲板下面的活皮肤。\"},{\"id\":\"anatomy-physiology-bed-epithelium\",\"word\":\"bed epithelium\",\"sayIt\":\"bed ep-ih-THEE-lee-um\",\"translation\":\"甲床上皮\",\"partOfSpeech\":\"Noun\",\"example\":\"The bed epithelium attaches the nail plate to the nail bed.\",\"exampleTranslation\":\"甲床上皮把甲板连接在甲床上。\"},{\"id\":\"anatomy-physiology-lateral-nail-fold\",\"word\":\"lateral nail fold\",\"sayIt\":\"LAT-er-ul nail fold\",\"translation\":\"侧甲襞\",\"partOfSpeech\":\"Noun\",\"example\":\"The lateral nail fold, or sidewall, is skin along the nail's side.\",\"exampleTranslation\":\"侧甲襞也叫 sidewall（侧壁），是指甲侧面的皮肤褶。\"},{\"id\":\"anatomy-physiology-proximal-nail-fold\",\"word\":\"proximal nail fold\",\"sayIt\":\"PROK-sih-mul nail fold\",\"translation\":\"近端甲襞\",\"partOfSpeech\":\"Noun\",\"example\":\"The proximal nail fold is living skin, so never cut it.\",\"exampleTranslation\":\"近端甲襞是活皮肤，所以绝不能剪。\"}]},{\"id\":\"2B\",\"title\":{\"en\":\"Nail Disorders and Diseases\",\"zh\":\"指甲病症与疾病\"},\"cards\":[{\"id\":\"anatomy-physiology-beau-s-lines\",\"word\":\"Beau's lines\",\"sayIt\":\"BOHZ lines\",\"translation\":\"博氏线\",\"partOfSpeech\":\"Noun\",\"example\":\"Beau's lines are dents that run across the width of the nail.\",\"exampleTranslation\":\"博氏线是横贯指甲宽度的凹陷。\"},{\"id\":\"anatomy-physiology-onychia\",\"word\":\"onychia\",\"sayIt\":\"uh-NIK-ee-uh\",\"translation\":\"甲母质炎\",\"partOfSpeech\":\"Noun\",\"example\":\"Onychia means the matrix is inflamed and the nail can fall off.\",\"exampleTranslation\":\"onychia（甲母质炎）是指甲母质发炎，指甲可能脱落。\"},{\"id\":\"anatomy-physiology-leukonychia\",\"word\":\"leukonychia\",\"sayIt\":\"loo-koh-NIK-ee-uh\",\"translation\":\"白甲\",\"partOfSpeech\":\"Noun\",\"example\":\"Leukonychia is white nail spots, usually from small matrix injuries.\",\"exampleTranslation\":\"白甲是指甲上的白斑，通常由甲母质的轻微损伤引起。\"},{\"id\":\"anatomy-physiology-melanonychia\",\"word\":\"melanonychia\",\"sayIt\":\"mel-uh-nuh-NIK-ee-uh\",\"translation\":\"黑甲\",\"partOfSpeech\":\"Noun\",\"example\":\"Melanonychia can be a dark band from nail base to free edge.\",\"exampleTranslation\":\"黑甲可能表现为从指甲根部到游离缘的一条深色带。\"},{\"id\":\"anatomy-physiology-nail-pterygium\",\"word\":\"nail pterygium\",\"sayIt\":\"nail tuh-RIJ-ee-um\",\"translation\":\"甲胬肉\",\"partOfSpeech\":\"Noun\",\"example\":\"Never push back nail pterygium; it is abnormally stretched skin.\",\"exampleTranslation\":\"绝不能推甲胬肉，它是异常拉伸的皮肤。\"},{\"id\":\"anatomy-physiology-onychorrhexis\",\"word\":\"onychorrhexis\",\"sayIt\":\"ahn-ih-koh-REK-sis\",\"translation\":\"脆甲\",\"partOfSpeech\":\"Noun\",\"example\":\"Onychorrhexis means split or brittle nails with a rough surface.\",\"exampleTranslation\":\"脆甲是指甲裂开或易碎，表面粗糙。\"},{\"id\":\"anatomy-physiology-splinter-hemorrhages\",\"word\":\"splinter hemorrhages\",\"sayIt\":\"SPLIN-ter HEM-er-ij-iz\",\"translation\":\"裂片形出血\",\"partOfSpeech\":\"Noun\",\"example\":\"Splinter hemorrhages come from damaged capillaries, not real splinters.\",\"exampleTranslation\":\"裂片形出血来自受损的毛细血管，不是真的木刺。\"},{\"id\":\"anatomy-physiology-onycholysis\",\"word\":\"onycholysis\",\"sayIt\":\"ahn-ih-KAHL-ih-sis\",\"translation\":\"甲剥离\",\"partOfSpeech\":\"Noun\",\"example\":\"Onycholysis is when the nail plate separates from the nail bed.\",\"exampleTranslation\":\"甲剥离是指甲板与甲床分开。\"},{\"id\":\"anatomy-physiology-onychocryptosis\",\"word\":\"onychocryptosis\",\"sayIt\":\"ahn-ih-koh-krip-TOH-sis\",\"translation\":\"嵌甲\",\"partOfSpeech\":\"Noun\",\"example\":\"Onychocryptosis means ingrown nails that grow into the skin at the sides.\",\"exampleTranslation\":\"嵌甲是指甲从侧边长进皮肉里。\"},{\"id\":\"anatomy-physiology-onychomycosis\",\"word\":\"onychomycosis\",\"sayIt\":\"ahn-ih-koh-my-KOH-sis\",\"translation\":\"甲真菌病\",\"partOfSpeech\":\"Noun\",\"example\":\"Onychomycosis is a fungal infection of the nail plate.\",\"exampleTranslation\":\"甲真菌病是甲板的真菌感染。\"},{\"id\":\"anatomy-physiology-paronychia\",\"word\":\"paronychia\",\"sayIt\":\"par-uh-NIK-ee-uh\",\"translation\":\"甲沟炎\",\"partOfSpeech\":\"Noun\",\"example\":\"Paronychia is a bacterial inflammation around the nail, with pus.\",\"exampleTranslation\":\"甲沟炎是指甲周围的细菌性发炎，会有脓。\"},{\"id\":\"anatomy-physiology-nail-psoriasis\",\"word\":\"nail psoriasis\",\"sayIt\":\"nail suh-RY-uh-sis\",\"translation\":\"甲银屑病\",\"partOfSpeech\":\"Noun\",\"example\":\"Nail psoriasis can cause tiny pits and a rough nail surface.\",\"exampleTranslation\":\"甲银屑病会让指甲表面出现小凹点、变粗糙。\"}]},{\"id\":\"2C\",\"title\":{\"en\":\"Skin Structure and Disorders\",\"zh\":\"皮肤结构与病症\"},\"cards\":[{\"id\":\"anatomy-physiology-epidermis\",\"word\":\"epidermis\",\"sayIt\":\"ep-ih-DUR-mis\",\"translation\":\"表皮\",\"partOfSpeech\":\"Noun\",\"example\":\"The epidermis is the outer, thinnest skin layer, with no blood vessels.\",\"exampleTranslation\":\"表皮是皮肤最外面、最薄的一层，没有血管。\"},{\"id\":\"anatomy-physiology-dermis\",\"word\":\"dermis\",\"sayIt\":\"$undefined\",\"translation\":\"真皮\",\"partOfSpeech\":\"Noun\",\"example\":\"The dermis, or true skin, has blood vessels and nerves.\",\"exampleTranslation\":\"真皮也叫“真正的皮肤”，里面有血管和神经。\"},{\"id\":\"anatomy-physiology-subcutaneous-tissue\",\"word\":\"subcutaneous tissue\",\"sayIt\":\"sub-kyoo-TAY-nee-us TISH-oo\",\"translation\":\"皮下组织\",\"partOfSpeech\":\"Noun\",\"example\":\"Subcutaneous tissue is a fatty layer below the dermis.\",\"exampleTranslation\":\"皮下组织是真皮下面的一层脂肪。\"},{\"id\":\"anatomy-physiology-stratum-corneum\",\"word\":\"stratum corneum\",\"sayIt\":\"STRAT-um KOR-nee-um\",\"translation\":\"角质层\",\"partOfSpeech\":\"Noun\",\"example\":\"The stratum corneum is the top skin layer that we care for.\",\"exampleTranslation\":\"角质层是我们护理的皮肤最上面一层。\"},{\"id\":\"anatomy-physiology-stratum-germinativum\",\"word\":\"stratum germinativum\",\"sayIt\":\"STRAT-um jer-mih-nuh-TY-vum\",\"translation\":\"生发层\",\"partOfSpeech\":\"Noun\",\"example\":\"The stratum germinativum, or basal layer, makes new skin cells.\",\"exampleTranslation\":\"生发层也叫基底层，会产生新的皮肤细胞。\"},{\"id\":\"anatomy-physiology-tinea-pedis\",\"word\":\"tinea pedis\",\"sayIt\":\"TIN-ee-uh PEE-dis\",\"translation\":\"足癣\",\"partOfSpeech\":\"Noun\",\"example\":\"Tinea pedis is athlete's foot, a fungal infection.\",\"exampleTranslation\":\"足癣就是脚气（athlete's foot），是一种真菌感染。\"},{\"id\":\"anatomy-physiology-sudoriferous-glands\",\"word\":\"sudoriferous glands\",\"sayIt\":\"soo-duh-RIF-er-us glandz\",\"translation\":\"汗腺\",\"partOfSpeech\":\"Noun\",\"example\":\"Sudoriferous glands, or sweat glands, send sweat out through pores.\",\"exampleTranslation\":\"汗腺（sweat glands）把汗液从毛孔排出。\"},{\"id\":\"anatomy-physiology-sebaceous-glands\",\"word\":\"sebaceous glands\",\"sayIt\":\"sih-BAY-shus glandz\",\"translation\":\"皮脂腺\",\"partOfSpeech\":\"Noun\",\"example\":\"Sebaceous glands make sebum, the oil that keeps skin soft.\",\"exampleTranslation\":\"皮脂腺分泌皮脂，这种油让皮肤保持柔软。\"},{\"id\":\"anatomy-physiology-macule\",\"word\":\"macule\",\"sayIt\":\"MAK-yool\",\"translation\":\"斑疹\",\"partOfSpeech\":\"Noun\",\"example\":\"A macule is a flat spot of color, like a freckle.\",\"exampleTranslation\":\"斑疹是平的色斑，比如雀斑。\"},{\"id\":\"anatomy-physiology-bromhidrosis\",\"word\":\"bromhidrosis\",\"sayIt\":\"broh-mih-DROH-sis\",\"translation\":\"臭汗症\",\"partOfSpeech\":\"Noun\",\"example\":\"Bromhidrosis is bad-smelling sweat, often in armpits or on feet.\",\"exampleTranslation\":\"臭汗症是气味难闻的汗，常见于腋下或脚部。\"},{\"id\":\"anatomy-physiology-chloasma\",\"word\":\"chloasma\",\"sayIt\":\"kloh-AZ-muh\",\"translation\":\"黄褐斑\",\"partOfSpeech\":\"Noun\",\"example\":\"Chloasma are dark, flat spots, wrongly called liver spots.\",\"exampleTranslation\":\"黄褐斑是平的深色斑点，常被误称为“肝斑”。\"},{\"id\":\"anatomy-physiology-verruca\",\"word\":\"verruca\",\"sayIt\":\"vuh-ROO-kuh\",\"translation\":\"疣\",\"partOfSpeech\":\"Noun\",\"example\":\"Verruca is a wart; a virus causes it, so it can spread.\",\"exampleTranslation\":\"verruca（疣）就是瘊子，由病毒引起，所以可能传染。\"}]},{\"id\":\"2D\",\"title\":{\"en\":\"Bones, Muscles, and Joints of Arms, Hands, Legs, and Feet\",\"zh\":\"手臂、手、腿和脚的骨骼、肌肉与关节\"},\"cards\":[{\"id\":\"anatomy-physiology-humerus\",\"word\":\"humerus\",\"sayIt\":\"HYOO-mer-us\",\"translation\":\"肱骨\",\"partOfSpeech\":\"Noun\",\"example\":\"The humerus is the big bone from your shoulder to your elbow.\",\"exampleTranslation\":\"肱骨是从肩膀到肘部的那根大骨头。\"},{\"id\":\"anatomy-physiology-ulna\",\"word\":\"ulna\",\"sayIt\":\"UL-nuh\",\"translation\":\"尺骨\",\"partOfSpeech\":\"Noun\",\"example\":\"The ulna is the forearm bone on the little-finger side.\",\"exampleTranslation\":\"尺骨是前臂位于小指一侧的骨头。\"},{\"id\":\"anatomy-physiology-radius\",\"word\":\"radius\",\"sayIt\":\"RAY-dee-us\",\"translation\":\"桡骨\",\"partOfSpeech\":\"Noun\",\"example\":\"The radius is the forearm bone on the thumb side.\",\"exampleTranslation\":\"桡骨是前臂位于拇指一侧的骨头。\"},{\"id\":\"anatomy-physiology-carpus\",\"word\":\"carpus\",\"sayIt\":\"KAR-pus\",\"translation\":\"腕骨\",\"partOfSpeech\":\"Noun\",\"example\":\"The carpus, or wrist, has eight small bones.\",\"exampleTranslation\":\"腕骨（即手腕）由八块小骨头组成。\"},{\"id\":\"anatomy-physiology-metacarpus\",\"word\":\"metacarpus\",\"sayIt\":\"met-uh-KAR-pus\",\"translation\":\"掌骨\",\"partOfSpeech\":\"Noun\",\"example\":\"The metacarpus is the five bones in the palm of the hand.\",\"exampleTranslation\":\"掌骨是手掌里的五块骨头。\"},{\"id\":\"anatomy-physiology-phalanges\",\"word\":\"phalanges\",\"sayIt\":\"fuh-LAN-jeez\",\"translation\":\"指骨/趾骨\",\"partOfSpeech\":\"Noun\",\"example\":\"Phalanges are the bones of the fingers and toes.\",\"exampleTranslation\":\"指骨/趾骨是手指和脚趾的骨头。\"},{\"id\":\"anatomy-physiology-extensors\",\"word\":\"extensors\",\"sayIt\":\"ik-STEN-serz\",\"translation\":\"伸肌\",\"partOfSpeech\":\"Noun\",\"example\":\"Extensors are muscles that straighten the wrist, hand, and fingers.\",\"exampleTranslation\":\"伸肌是把手腕、手和手指伸直的肌肉。\"},{\"id\":\"anatomy-physiology-tibia\",\"word\":\"tibia\",\"sayIt\":\"TIB-ee-uh\",\"translation\":\"胫骨\",\"partOfSpeech\":\"Noun\",\"example\":\"The tibia is the larger of the two bones below the knee.\",\"exampleTranslation\":\"胫骨是膝盖下面两根骨头中较大的那根。\"},{\"id\":\"anatomy-physiology-femur\",\"word\":\"femur\",\"sayIt\":\"FEE-mer\",\"translation\":\"股骨\",\"partOfSpeech\":\"Noun\",\"example\":\"The femur is the heavy, long bone above the knee.\",\"exampleTranslation\":\"股骨是膝盖上面那根又重又长的骨头。\"},{\"id\":\"anatomy-physiology-abductors\",\"word\":\"abductors\",\"sayIt\":\"ab-DUK-terz\",\"translation\":\"外展肌\",\"partOfSpeech\":\"Noun\",\"example\":\"Abductors are muscles that separate the fingers.\",\"exampleTranslation\":\"外展肌是把手指分开的肌肉。\"},{\"id\":\"anatomy-physiology-pronators\",\"word\":\"pronators\",\"sayIt\":\"PROH-nay-terz\",\"translation\":\"旋前肌\",\"partOfSpeech\":\"Noun\",\"example\":\"Pronators turn the hand so the palm faces down.\",\"exampleTranslation\":\"旋前肌让手转动，使掌心朝下。\"},{\"id\":\"anatomy-physiology-gastrocnemius\",\"word\":\"gastrocnemius\",\"sayIt\":\"gas-truk-NEE-mee-us\",\"translation\":\"腓肠肌\",\"partOfSpeech\":\"Noun\",\"example\":\"The gastrocnemius attaches at the heel and pulls the foot down.\",\"exampleTranslation\":\"腓肠肌附着在脚跟上，把脚往下拉。\"}]},{\"id\":\"2E\",\"title\":{\"en\":\"More Key Facts\",\"zh\":\"更多重点\"},\"cards\":[{\"id\":\"anatomy-physiology-melanin\",\"word\":\"melanin\",\"sayIt\":\"MEL-uh-nin\",\"translation\":\"黑色素\",\"partOfSpeech\":\"Noun\",\"example\":\"Melanin gives the skin its color.\",\"exampleTranslation\":\"黑色素决定皮肤的颜色。\"},{\"id\":\"anatomy-physiology-flexors\",\"word\":\"flexors\",\"sayIt\":\"FLEK-sorz\",\"translation\":\"屈肌\",\"partOfSpeech\":\"Noun\",\"example\":\"Flexors are muscles that help bend the wrist.\",\"exampleTranslation\":\"屈肌是帮助弯曲手腕的肌肉。\"},{\"id\":\"anatomy-physiology-metatarsals\",\"word\":\"metatarsals\",\"sayIt\":\"met-uh-TAR-sulz\",\"translation\":\"跖骨\",\"partOfSpeech\":\"Noun\",\"example\":\"The five metatarsals are long, slender bones of the foot.\",\"exampleTranslation\":\"五块跖骨是脚上细长的骨头。\"},{\"id\":\"anatomy-physiology-patella\",\"word\":\"patella\",\"sayIt\":\"puh-TEL-uh\",\"translation\":\"髌骨\",\"partOfSpeech\":\"Noun\",\"example\":\"The patella forms the cap of the knee.\",\"exampleTranslation\":\"髌骨构成膝盖的盖子。\"},{\"id\":\"anatomy-physiology-vesicle\",\"word\":\"vesicle\",\"sayIt\":\"VES-ih-kul\",\"translation\":\"水疱\",\"partOfSpeech\":\"Noun\",\"example\":\"A vesicle is a small blister with clear fluid.\",\"exampleTranslation\":\"水疱是装着清澈液体的小水泡。\"},{\"id\":\"anatomy-physiology-ulcer\",\"word\":\"ulcer\",\"sayIt\":\"UL-ser\",\"translation\":\"溃疡\",\"partOfSpeech\":\"Noun\",\"example\":\"An ulcer is an open lesion on the skin.\",\"exampleTranslation\":\"溃疡是皮肤上的开放性皮损。\"},{\"id\":\"anatomy-physiology-vitiligo\",\"word\":\"vitiligo\",\"sayIt\":\"vit-ih-LY-go\",\"translation\":\"白癜风\",\"partOfSpeech\":\"Noun\",\"example\":\"Vitiligo causes milky-white spots on the skin.\",\"exampleTranslation\":\"白癜风会让皮肤出现乳白色斑点。\"},{\"id\":\"anatomy-physiology-malignant-melanoma\",\"word\":\"malignant melanoma\",\"sayIt\":\"muh-LIG-nunt mel-uh-NOH-muh\",\"translation\":\"恶性黑色素瘤\",\"partOfSpeech\":\"Noun\",\"example\":\"Malignant melanoma is the most serious form of skin cancer.\",\"exampleTranslation\":\"恶性黑色素瘤是最严重的皮肤癌。\"}]}],\"storageKey\":\"exam-topic-words-anatomy-physiology\",\"backHref\":\"/nail-exam-practice/exam-topics/anatomy-physiology\",\"backTitle\":{\"en\":\"Anatomy and Physiology\",\"zh\":\"解剖学与生理学\"},\"shuffle\":true}]\n"])</script><script>self.__next_f.push([1,"11:null\n"])</script><script>self.__next_f.push([1,"15:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#ffffff\"}]]\n10:null\n"])</script><script>self.__next_f.push([1,"19:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Study Zone | 学习区\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Learn irregular verbs, vocabulary, and English grammar easily\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/practice/manifest.json\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"3\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Study Zone\"}],[\"$\",\"meta\",\"5\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"6\",{\"rel\":\"icon\",\"href\":\"/practice/icon.svg\"}],[\"$\",\"link\",\"7\",{\"rel\":\"apple-touch-icon\",\"href\":\"/practice/apple-icon.png\"}]],\"error\":null,\"digest\":\"$undefined\"}\n13:{\"metadata\":\"$19:metadata\",\"error\":null,\"digest\":\"$undefined\"}\n"])</script></body></html>
