ission, tiny dry particles with germs hang in the air.\",\"exampleTranslation\":\"空气传播时，带着病菌的小而干的颗粒会悬浮在空气中。\"},{\"id\":\"infection-control-contagious-disease\",\"word\":\"contagious disease\",\"sayIt\":\"kun-TAY-jus dih-ZEEZ\",\"translation\":\"传染性疾病\",\"partOfSpeech\":\"Noun\",\"example\":\"A contagious disease, like a cold, spreads from person to person.\",\"exampleTranslation\":\"传染性疾病（例如感冒）会人传人。\"},{\"id\":\"infection-control-occupational-disease\",\"word\":\"occupational disease\",\"sayIt\":\"ok-yuh-PAY-shuh-nul dih-ZEEZ\",\"translation\":\"职业病\",\"partOfSpeech\":\"Noun\",\"example\":\"Too much contact with products at work can cause an occupational disease.\",\"exampleTranslation\":\"工作中过多接触产品可能导致职业病。\"},{\"id\":\"infection-control-nonpathogenic\",\"word\":\"nonpathogenic\",\"sayIt\":\"non-path-uh-JEN-ik\",\"translation\":\"非致病性\",\"partOfSpeech\":\"Adjective\",\"example\":\"Nonpathogenic bacteria are harmless; some help make yogurt.\",\"exampleTranslation\":\"非致病性细菌是无害的，有些还能帮助制作酸奶。\"},{\"id\":\"infection-control-inflammation\",\"word\":\"inflammation\",\"sayIt\":\"in-fluh-MAY-shun\",\"translation\":\"炎症\",\"partOfSpeech\":\"Noun\",\"example\":\"Inflammation shows as redness, heat, pain, or swelling.\",\"exampleTranslation\":\"炎症表现为发红、发热、疼痛或肿胀。\"},{\"id\":\"infection-control-immunity\",\"word\":\"immunity\",\"sayIt\":\"ih-MYOO-nih-tee\",\"translation\":\"免疫\",\"partOfSpeech\":\"Noun\",\"example\":\"Immunity is your body's power to fight off germs.\",\"exampleTranslation\":\"免疫是身体抵抗病菌的能力。\"},{\"id\":\"infection-control-mycobacterium\",\"word\":\"mycobacterium\",\"sayIt\":\"my-koh-bak-TEER-ee-um\",\"translation\":\"分枝杆菌\",\"partOfSpeech\":\"Noun\",\"example\":\"Mycobacterium infections are linked to pedicure bowls, so disinfect every bowl.\",\"exampleTranslation\":\"分枝杆菌感染与足浴盆有关，所以每个足浴盆都要消毒。\"},{\"id\":\"infection-control-bloodborne-pathogens\",\"word\":\"bloodborne pathogens\",\"sayIt\":\"BLUD-born PATH-uh-jenz\",\"translation\":\"血源性病原体\",\"partOfSpeech\":\"Noun\",\"example\":\"HIV and hepatitis are bloodborne pathogens carried in blood.\",\"exampleTranslation\":\"HIV 和肝炎是存在于血液中的血源性病原体。\"},{\"id\":\"infection-control-biofilm\",\"word\":\"biofilm\",\"sayIt\":\"BY-oh-film\",\"translation\":\"生物膜\",\"partOfSpeech\":\"Noun\",\"example\":\"A biofilm is a sticky layer of germs, like slime in drains.\",\"exampleTranslation\":\"生物膜是一层黏黏的微生物，就像下水道里的黏液。\"},{\"id\":\"infection-control-ringworm\",\"word\":\"ringworm\",\"sayIt\":\"$undefined\",\"translation\":\"癣\",\"partOfSpeech\":\"Noun\",\"example\":\"Ringworm is a skin infection caused by a fungus, not a worm.\",\"exampleTranslation\":\"癣是一种由真菌引起的皮肤感染，不是虫。\"},{\"id\":\"infection-control-scabies\",\"word\":\"scabies\",\"sayIt\":\"SKAY-beez\",\"translation\":\"疥疮\",\"partOfSpeech\":\"Noun\",\"example\":\"Scabies is caused by the itch mite, which digs under the skin.\",\"exampleTranslation\":\"疥疮是由疥螨引起的，疥螨会钻到皮肤下面。\"}]},{\"id\":\"1B\",\"title\":{\"en\":\"Levels and Process of Infection Control\",\"zh\":\"感染控制的等级与流程\"},\"cards\":[{\"id\":\"infection-control-sterilizing\",\"word\":\"sterilizing\",\"sayIt\":\"STAIR-uh-ly-zing\",\"translation\":\"灭菌\",\"partOfSpeech\":\"Noun\",\"example\":\"Sterilizing kills all germs, even bacterial spores.\",\"exampleTranslation\":\"灭菌能杀死所有微生物，连细菌芽孢也能杀死。\"},{\"id\":\"infection-control-bacterial-spores\",\"word\":\"bacterial spores\",\"sayIt\":\"bak-TEER-ee-ul SPORZ\",\"translation\":\"细菌芽孢\",\"partOfSpeech\":\"Noun\",\"example\":\"Disinfecting does not kill bacterial spores; sterilizing does.\",\"exampleTranslation\":\"消毒杀不死细菌芽孢，灭菌才能杀死。\"},{\"id\":\"infection-control-contact-time\",\"word\":\"contact time\",\"sayIt\":\"$undefined\",\"translation\":\"接触时间\",\"partOfSpeech\":\"Noun\",\"example\":\"Contact time is how long the disinfectant must stay wet.\",\"exampleTranslation\":\"接触时间是指消毒剂必须在表面保持湿润的时间。\"},{\"id\":\"infection-control-dilute\",\"word\":\"dilute\",\"sayIt\":\"dy-LOOT\",\"translation\":\"稀释\",\"partOfSpeech\":\"Verb\",\"example\":\"Dilute a concentrate by adding it to water, not water to it.\",\"exampleTranslation\":\"稀释浓缩液时，要把浓缩液倒进水里，而不是把水倒进浓缩液。\"},{\"id\":\"infection-control-tuberculocidal\",\"word\":\"tuberculocidal\",\"sayIt\":\"tuh-bur-kyuh-loh-SY-dul\",\"translation\":\"杀结核菌\",\"partOfSpeech\":\"Adjective\",\"example\":\"A tuberculocidal disinfectant kills the germ that causes tuberculosis.\",\"exampleTranslation\":\"杀结核菌消毒剂能杀死引起结核病的细菌。\"},{\"id\":\"infection-control-phenolic-disinfectants\",\"word\":\"phenolic disinfectants\",\"sayIt\":\"fih-NOH-lik dis-in-FEK-tunts\",\"translation\":\"酚类消毒剂\",\"partOfSpeech\":\"Noun\",\"example\":\"Phenolic disinfectants kill tuberculosis germs but can hurt skin and eyes.\",\"exampleTranslation\":\"酚类消毒剂能杀死结核菌，但会伤害皮肤和眼睛。\"},{\"id\":\"infection-control-isopropyl-alcohol\",\"word\":\"isopropyl alcohol\",\"sayIt\":\"eye-suh-PROH-pul AL-kuh-hawl\",\"translation\":\"异丙醇\",\"partOfSpeech\":\"Noun\",\"example\":\"Isopropyl alcohol cleans skin, but it does not disinfect tools.\",\"exampleTranslation\":\"异丙醇能清洁皮肤，但不能给工具消毒。\"},{\"id\":\"infection-control-antiseptic\",\"word\":\"antiseptic\",\"sayIt\":\"an-tih-SEP-tik\",\"translation\":\"皮肤抗菌剂\",\"partOfSpeech\":\"Noun\",\"example\":\"An antiseptic is used on skin, not on tools.\",\"exampleTranslation\":\"皮肤抗菌剂用在皮肤上，不用在工具上。\"},{\"id\":\"infection-control-nonporous\",\"word\":\"nonporous\",\"sayIt\":\"non-POR-us\",\"translation\":\"无孔\",\"partOfSpeech\":\"Adjective\",\"example\":\"A nonporous item has no holes and cannot soak up liquid.\",\"exampleTranslation\":\"无孔的物品没有小孔，不会吸收液体。\"},{\"id\":\"infection-control-single-use\",\"word\":\"single-use\",\"sayIt\":\"$undefined\",\"translation\":\"一次性\",\"partOfSpeech\":\"Adjective\",\"example\":\"A single-use item is used on one client, then thrown away.\",\"exampleTranslation\":\"一次性用品只给一位顾客用，用完就丢掉。\"},{\"id\":\"infection-control-standard-precautions\",\"word\":\"Standard Precautions\",\"sayIt\":\"STAN-derd prih-KAW-shunz\",\"translation\":\"标准预防措施\",\"partOfSpeech\":\"Noun\",\"
