yIt\":\"$undefined\",\"translation\":\"溶剂\",\"partOfSpeech\":\"Noun\",\"example\":\"Acetone is a solvent: it dissolves old nail polish.\",\"exampleTranslation\":\"丙酮是一种溶剂：它能溶解旧甲油。\"},{\"id\":\"chemistry-suspension\",\"word\":\"suspension\",\"sayIt\":\"suh-SPEN-shun\",\"translation\":\"悬浮液\",\"partOfSpeech\":\"Noun\",\"example\":\"Glitter polish is a suspension: the glitter can separate from the polish.\",\"exampleTranslation\":\"亮片甲油是悬浮液：亮片会和甲油分离。\"},{\"id\":\"chemistry-emulsifier\",\"word\":\"emulsifier\",\"sayIt\":\"ih-MUL-suh-fy-er\",\"translation\":\"乳化剂\",\"partOfSpeech\":\"Noun\",\"example\":\"An emulsifier holds oil and water together, like egg yolk in mayonnaise.\",\"exampleTranslation\":\"乳化剂能让油和水保持混合，比如蛋黄酱里的蛋黄。\"},{\"id\":\"chemistry-miscible\",\"word\":\"miscible\",\"sayIt\":\"MISS-uh-bul\",\"translation\":\"可互溶的\",\"partOfSpeech\":\"Adjective\",\"example\":\"Water and alcohol are miscible: they mix and stay mixed.\",\"exampleTranslation\":\"水和酒精是可互溶的：混合后会一直保持混合。\"},{\"id\":\"chemistry-alkaline\",\"word\":\"alkaline\",\"sayIt\":\"AL-kuh-line\",\"translation\":\"碱性的\",\"partOfSpeech\":\"Adjective\",\"example\":\"A product with a pH above 7 is alkaline.\",\"exampleTranslation\":\"pH 高于 7 的产品是碱性的。\"},{\"id\":\"chemistry-exothermic\",\"word\":\"exothermic\",\"sayIt\":\"ek-soh-THUR-mik\",\"translation\":\"放热的\",\"partOfSpeech\":\"Adjective\",\"example\":\"Nail enhancement products give off heat as they harden: an exothermic reaction.\",\"exampleTranslation\":\"加固甲产品变硬时会放出热量：这是放热反应。\"},{\"id\":\"chemistry-monomer\",\"word\":\"monomer\",\"sayIt\":\"MAH-nuh-mer\",\"translation\":\"单体\",\"partOfSpeech\":\"Noun\",\"example\":\"Monomers are single molecules that join to make a polymer.\",\"exampleTranslation\":\"单体是能连接起来组成聚合物的单个分子。\"},{\"id\":\"chemistry-catalyst\",\"word\":\"catalyst\",\"sayIt\":\"KAT-uh-list\",\"translation\":\"催化剂\",\"partOfSpeech\":\"Noun\",\"example\":\"A catalyst speeds up reactions, so nail enhancements harden quickly.\",\"exampleTranslation\
