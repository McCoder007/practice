eech\":\"Noun\",\"example\":\"Grounding carries current safely away and protects you from shock.\",\"exampleTranslation\":\"接地能把电流安全地导走，保护你不触电。\"},{\"id\":\"tools-fuse\",\"word\":\"fuse\",\"sayIt\":\"$undefined\",\"translation\":\"保险丝\",\"partOfSpeech\":\"Noun\",\"example\":\"A fuse melts when too much current runs through the circuit.\",\"exampleTranslation\":\"电路里电流过大时，保险丝会熔断。\"}]},{\"id\":\"5B\",\"title\":{\"en\":\"Implements and Safe Use\",\"zh\":\"工具与安全使用\"},\"cards\":[{\"id\":\"tools-stainless-steel\",\"word\":\"stainless steel\",\"sayIt\":\"$undefined\",\"translation\":\"不锈钢\",\"partOfSpeech\":\"Noun\",\"example\":\"Multiuse implements are usually stainless steel, so they can be disinfected.\",\"exampleTranslation\":\"可重复使用的工具通常用不锈钢做，所以能消毒。\"},{\"id\":\"tools-metal-pusher\",\"word\":\"metal pusher\",\"sayIt\":\"$undefined\",\"translation\":\"钢推\",\"partOfSpeech\":\"Noun\",\"example\":\"A metal pusher gently scrapes cuticle tissue off the nail plate.\",\"exampleTranslation\":\"钢推用来轻轻刮掉甲面上的死皮组织。\"},{\"id\":\"tools-nail-nippers\",\"word\":\"nail nippers\",\"sayIt\":\"$undefined\",\"translation\":\"死皮剪\",\"partOfSpeech\":\"Noun\",\"example\":\"Nail nippers trim dead skin; never use them on live skin.\",\"exampleTranslation\":\"死皮剪用来修剪死皮，绝不能用来剪活皮。\"},{\"id\":\"tools-box-joint\",\"word\":\"box joint\",\"sayIt\":\"$undefined\",\"translation\":\"剪轴\",\"partOfSpeech\":\"Noun\",\"example\":\"Put your index finger on the nippers' box joint for control.\",\"exampleTranslation\":\"把食指放在死皮剪的剪轴上，更好控制。\"},{\"id\":\"tools-grit\",\"word\":\"grit\",\"sayIt\":\"$undefined\",\"translation\":\"目数\",\"partOfSpeech\":\"Noun\",\"example\":\"A lower grit number means bigger grains and a rougher file.\",\"exampleTranslation\":\"目数越低，颗粒越大，锉条越粗。\"},{\"id\":\"tools-curette\",\"word\":\"curette\",\"sayIt\":\"kyoo-RET\",\"translation\":\"刮匙\",\"partOfSpeech\":\"Noun\",\"example\":\"A curette has a small scoop for cleaning out the nail folds.\",\"exampleTranslation\":\"刮匙有一个小勺头，用来清理甲沟。\"},{\ 落，增加光泽。\"},{\"id\":\"tools-pumice\",\"word\":\"pumice\",\"sayIt\":\"PUM-iss\",\"translation\":\"浮石粉\",\"partOfSpeech\":\"Noun\",\"example\":\"Pumice can be the gritty part of a pedicure scrub.\",\"exampleTranslation\":\"浮石粉可以是修脚磨砂膏里的颗粒成分。\"},{\"id\":\"tools-corn-meal\",\"word\":\"corn meal\",\"sayIt\":\"$undefined\",\"translation\":\"玉米粉\",\"partOfSpeech\":\"Noun\",\"example\":\"Corn meal can expand and clog the pedicure drain.\",\"exampleTranslation\":\"玉米粉会膨胀，堵塞修脚盆的下水口。\"},{\"id\":\"tools-callus-softener\",\"word\":\"callus softener\",\"sayIt\":\"KAL-us SAW-fuh-ner\",\"translation\":\"去茧软化剂\",\"partOfSpeech\":\"Noun\",\"example\":\"Callus softeners soften thick calluses; wear safety glasses with alkaline ones.\",\"exampleTranslation\":\"去茧软化剂能软化厚茧；用碱性的去茧软化剂时要戴护目镜。\"}]},{\"id\":\"5D\",\"title\":{\"en\":\"More Key Facts\",\"zh\":\"更多重点\"},\"cards\":[{\"id\":\"tools-rings-of-fire\",\"word\":\"rings of fire\",\"sayIt\":\"$undefined\",\"translation\":\"火圈\",\"partOfSpeech\":\"Noun\",\"example\":\"Rings of fire are red marks a bit's edge cuts into nails.\",\"exampleTranslation\":\"火圈是磨头边缘在指甲上割出的红色痕迹。\"},{\"id\":\"tools-parallel\",\"word\":\"parallel\",\"sayIt\":\"PAIR-uh-lel\",\"translation\":\"平行\",\"partOfSpeech\":\"Adjective\",\"example\":\"Keep the bit parallel to the nail to avoid rings of fire.\",\"exampleTranslation\":\"让磨头与指甲保持平行，就能避免火圈。\"},{\"id\":\"tools-dust-mask\",\"word\":\"dust mask\",\"sayIt\":\"$undefined\",\"translation\":\"防尘口罩\",\"partOfSpeech\":\"Noun\",\"example\":\"Always wear an N95 dust mask when you file nails.\",\"exampleTranslation\":\"锉磨指甲时一定要戴 N95 防尘口罩。\"},{\"id\":\"tools-non-acetone\",\"word\":\"non-acetone\",\"sayIt\":\"non-AS-uh-tone\",\"translation\":\"无丙酮\",\"partOfSpeech\":\"Adjective\",\"example\":\"Use non-acetone remover to take polish off wraps.\",\"exampleTranslation\":\"卸包甲上的指甲油时，用无丙酮洗甲水。\"}]}],\"storageKey\":\"exam-topic-words-tools\",\"backHref\":\"/nail-exam-practice/exam-topics/tools\",\"backTitle\":{\"en\":\"Nail Service Too
