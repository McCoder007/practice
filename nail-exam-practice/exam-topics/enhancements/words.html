"word\":\"well\",\"sayIt\":\"$undefined\",\"translation\":\"凹槽\",\"partOfSpeech\":\"Noun\",\"example\":\"A tip's well is the low spot that touches the nail.\",\"exampleTranslation\":\"甲片的凹槽就是贴在真甲上的那个浅凹处。\"},{\"id\":\"enhancements-position-stop\",\"word\":\"position stop\",\"sayIt\":\"puh-ZISH-un stop\",\"translation\":\"定位点\",\"partOfSpeech\":\"Noun\",\"example\":\"The free edge stops at the position stop inside the well.\",\"exampleTranslation\":\"真甲的游离缘在凹槽里抵住的地方，就是定位点。\"},{\"id\":\"enhancements-nail-dehydrator\",\"word\":\"nail dehydrator\",\"sayIt\":\"nayl dee-HY-dray-ter\",\"translation\":\"脱水剂\",\"partOfSpeech\":\"Noun\",\"example\":\"A nail dehydrator removes moisture and oil from the nail plate.\",\"exampleTranslation\":\"脱水剂能去除甲面上的水分和油分。\"},{\"id\":\"enhancements-overlay\",\"word\":\"overlay\",\"sayIt\":\"OH-ver-lay\",\"translation\":\"加固层\",\"partOfSpeech\":\"Noun\",\"example\":\"Tips need an overlay: a layer of product over the whole nail.\",\"exampleTranslation\":\"甲片需要加固层：覆盖整个指甲的一层产品。\"},{\"id\":\"enhancements-nail-form\",\"word\":\"nail form\",\"sayIt\":\"$undefined\",\"translation\":\"纸托\",\"partOfSpeech\":\"Noun\",\"example\":\"A nail form goes under the free edge to guide new length.\",\"exampleTranslation\":\"纸托放在游离缘下面，引导做出新的长度。\"},{\"id\":\"enhancements-apex\",\"word\":\"apex\",\"sayIt\":\"AY-peks\",\"translation\":\"甲峰\",\"partOfSpeech\":\"Noun\",\"example\":\"The apex is the highest point of the nail enhancement.\",\"exampleTranslation\":\"甲峰是美甲加固上最高的那一点。\"},{\"id\":\"enhancements-stress-area\",\"word\":\"stress area\",\"sayIt\":\"stress AIR-ee-uh\",\"translation\":\"受力区\",\"partOfSpeech\":\"Noun\",\"example\":\"The stress area is where the nail grows past the finger.\",\"exampleTranslation\":\"受力区就是指甲长出手指的地方。\"},{\"id\":\"enhancements-fiberglass-wrap\",\"word\":\"fiberglass wrap\",\"sayIt\":\"FY-ber-glass rap\",\"translation\":\"玻璃纤维包甲\",\"partOfSpeech\":\"Noun\",\"example\":\"A fiberglass wrap is a thin man-made mesh with a loose weave.\",\"exampleTranslation\":\"玻璃纤维包甲是一种很薄、织得较松的合成网布。\"},{\"id\":\"enhancements-nail-resin\",\"word\":\"nail resin\",\"sayIt\":\"nayl REZ-in\",\"translation\":\"甲用树脂\",\"partOfSpeech\":\"Noun\",\"example\":\"Nail resin is a fast-acting glue used with tips and wraps.\",\"exampleTranslation\":\"甲用树脂是一种快干胶，用来粘甲片和做包甲。\"},{\"id\":\"enhancements-resin-accelerator\",\"word\":\"resin accelerator\",\"sayIt\":\"REZ-in ak-SEL-er-ay-ter\",\"translation\":\"树脂加速剂\",\"partOfSpeech\":\"Noun\",\"example\":\"A resin accelerator, or activator, makes nail resin dry faster.\",\"exampleTranslation\":\"树脂加速剂（也叫激活剂）能让甲用树脂干得更快。\"}]},{\"id\":\"7B\",\"title\":{\"en\":\"Monomer Liquid and Polymer Powder\",\"zh\":\"水晶甲：单体液与聚合物粉\"},\"cards\":[{\"id\":\"enhancements-mix-ratio\",\"word\":\"mix ratio\",\"sayIt\":\"miks RAY-shee-oh\",\"translation\":\"液粉比\",\"partOfSpeech\":\"Noun\",\"example\":\"The mix ratio is how much liquid and powder make a bead.\",\"exampleTranslation\":\"液粉比就是做一颗水晶球用了多少液体、多少粉。\"},{\"id\":\"enhancements-medium-bead\",\"word\":\"medium bead\",\"sayIt\":\"MEE-dee-um beed\",\"translation\":\"中球\",\"partOfSpeech\":\"Noun\",\"example\":\"A medium bead is usually the best mix for liquid and powder.\",\"exampleTranslation\":\"中球通常是做水晶甲最理想的液粉比。\"},{\"id\":\"enhancements-odorless\",\"word\":\"odorless\",\"sayIt\":\"OH-der-les\",\"translation\":\"无味\",\"partOfSpeech\":\"Adjective\",\"example\":\"Odorless monomer has a slight smell others in the salon can't notice.\",\"exampleTranslation\":\"无味单体液其实有一点气味，只是店里其他人闻不出来。\"},{\"id\":\"enhancements-discoloration\",\"word\":\"discoloration\",\"sayIt\":\"dis-kul-er-AY-shun\",\"translation\":\"变色\",\"partOfSpeech\":\"Noun\",\"example\":\"Discoloration is a change in color; too much powder can cause it.\",\"exampleTranslation\":\"变色就是颜色改变了；水晶球里粉太多就可能造成变色。\"},{\"id\":\"enhancements-service-breakdown\",\"word\":\"service breakdown\",\"sayIt\":\"$undefined\",\"translation\":\"美甲提前损坏\",\"partOfSpeech\":\"Noun\",\"example\":\"Product over wet primer can cause service breakdown.\",\"exampleTranslation\":\"在未干的结合剂上做产品，可能导致美甲提前损坏。\"},{\"id\":\"enhancements-pry\",\"word\":\"pry\",\"sayIt\":\"$undefined\",\"translation\":\"撬\",\"partOfSpeech\":\"Verb\",\"example\":\"Never pry a nail tip off; soak it a few more minutes.\",\"exampleTranslation\":\"不要硬撬甲片，再多泡几分钟。\"},{\"id\":\"enhancements-kolinsky\",\"word\":\"kolinsky\",\"sayIt\":\"kuh-LIN-skee\",\"translation\":\"貂毛\",\"partOfSpeech\":\"Noun\",\"example\":\"A kolinsky brush has natural hair that holds monomer well.\",\"exampleTranslation\":\"貂毛笔是天然毛，能很好地吸住单体液。\"},{\"id\":\"enhancements-ferrule\",\"word\":\"ferrule\",\"sayIt\":\"FAIR-ul\",\"translation\":\"笔箍\",\"partOfSpeech\":\"Noun\",\"example\":\"The ferrule is the metal band that holds the brush hairs.\",\"exampleTranslation\":\"笔箍就是固定笔毛的那圈金属。\"},{\"id\":\"enhancements-polymer-powder\",\"word\":\"polymer powder\",\"sayIt\":\"PAH-luh-mer POW-der\",\"translation\":\"聚合物粉\",\"partOfSpeech\":\"Noun\",\"example\":\"Polymer powder is tiny beads made of long chains of monomers.\",\"exampleTranslation\":\"聚合物粉是由单体连成的长链做成的小颗粒。\"},{\"id\":\"enhancements-benzoyl-peroxide\",\"word\":\"benzoyl peroxide\",\"sayIt\":\"BEN-zoh-il puh-ROK-side\",\"translation\":\"过氧化苯甲酰\",\"partOfSpeech\":\"Noun\",\"example\":\"Benzoyl peroxide in the powder starts the chain reaction.\",\"exampleTranslation\":\"粉里的过氧化苯甲酰会启动链式反应。\"},{\"id\":\"enhancements-photoinitiator\",\"word\":\"photoinitiator\",\"sayIt\":\"foh-toh-ih-NISH-ee-ay-ter\",\"translation\":\"光引发剂\",\"partOfSpeech\":\"Noun\",\"example\":\"A photoinitiator makes gel harden under the lamp's light.\",\"exampleTranslation\":\"光引发剂让光疗胶在灯光下变硬。\"},{\"id\":\"enhancements-credit-card-thin\",\"word\":\"credit-card thin\",\"sayIt\":\"$undefined\",\"translation\":\"像信用卡一样薄\",\"partOfSpeech\":\"Phrase\",\"example\":\"The sidewalls and edge should be credit-card thin.\",\"exampleTranslation\":\"两侧和前缘应该像信用卡一样薄。\"}]},{\"id\":\"7C\",\"title\":{\"en\":\"Gels: Soft, Hard, and Hybrid\",\"zh\":\"光疗胶：软胶、硬胶与混合胶\"},\"cards\":[{\"id\":\"enhancements-oligomer\",\"word\":\"oligomer\",\"sayIt\":\"uh-LIG-uh-mer\",\"translation\":\"寡聚物\",\"partOfSpeech\":\"Noun\",\"example\":\"An oligomer is thick and sticky, between a liquid and solid.\",\"exampleTranslation\":\"寡聚物又稠又黏，介于液体和固体之间。\"},{\"id\":\"enhancements-hard-gel\",\"word\":\"hard gel\",\"sayIt\":\"$undefined\",\"translation\":\"硬胶\",\"partOfSpeech\":\"Noun\",\"example\":\"Hard gel cannot soak off in acetone, so you file it off.\",\"exampleTranslation\":\"硬胶不能用丙酮泡掉，所以要锉掉。\"},{\"id\":\"enhancements-soft-gel\",\"word\":\"soft gel\",\"sayIt\":\"$undefined\",\"translation\":\"软胶\",\"partOfSpeech\":\"Noun\",\"example\":\"Soft gel, or soak-off gel, comes off easily with acetone.\",\"exampleTranslation\":\"软胶也叫可卸胶，用丙酮就能轻松卸掉。\"},{\"id\":\"enhancements-hybrid-gel\",\"word\":\"hybrid gel\",\"sayIt\":\"HY-brid jel\",\"translation\":\"混合胶\",\"partOfSpeech\":\"Noun\",\"example\":\"Hybrid gel comes off with polish remover, but it takes longer.\",\"exampleTranslation\":\"混合胶可以用洗甲水卸掉，只是需要更长时间。\"},{\"id\":\"enhancements-inhibition-layer\",\"word\":\"inhibition layer\",\"sayIt\":\"in-hih-BISH-un lay-er\",\"translation\":\"浮胶层\",\"partOfSpeech\":\"Noun\",\"example\":\"Wipe the sticky inhibition layer off with alcohol or nail cleanser.\",\"exampleTranslation\":\"用酒精或甲面清洁剂把黏黏的浮胶层擦掉。\"},{\"id\":\"enhancements-building-gel\",\"word\":\"building gel\",\"sayIt\":\"$undefined\",\"translation\":\"建构胶\",\"partOfSpeech\":\"Noun\",\"example\":\"Building gel is thick and builds the arch or extension.\",\"exampleTranslation\":\"建构胶很稠，用来做甲拱或延长。\"},{\"id\":\"enhancements-bonding-gel\",\"word\":\"bonding gel\",\"sayIt\":\"$undefined\",\"translation\":\"结合胶\",\"partOfSpeech\":\"Noun\",\"example\":\"Bonding gel helps the gel stick to the natural nail.\",\"exampleTranslation\":\"结合胶帮助光疗胶附着在真甲上。\"},{\"id\":\"enhancements-self-leveling-gel\",\"word\":\"self-leveling gel\",\"sayIt\":\"self-LEV-uh-ling jel\",\"translation\":\"自流平胶\",\"partOfSpeech\":\"Noun\",\"example\":\"Self-leveling gel flows more and leaves the nail smooth.\",\"exampleTranslation\":\"自流平胶流动性更好，能让甲面平滑。\"},{\"id\":\"enhancements-polygel\",\"word\":\"polygel\",\"sayIt\":\"PAH-lee-jel\",\"translation\":\"聚合物胶\",\"partOfSpeech\":\"Noun\",\"example\":\"Polygel is a mix of polymer powder and hard gel.\",\"exampleTranslation\":\"聚合物胶是聚合物粉和硬胶的混合物。\"},{\"id\":\"enhancements-cross-linking\",\"word\":\"cross-linking\",\"sayIt\":\"$undefined\",\"translation\":\"交联\",\"partOfSpeech\":\"Noun\",\"example\":\"Cross-linking is like a net: the tighter, the harder the gel.\",\"exampleTranslation\":\"交联就像一张网：网越紧，胶就越硬。\"},{\"id\":\"enhancements-tack-free\",\"word\":\"tack-free\",\"sayIt\":\"$undefined\",\"translation\":\"免洗\",\"partOfSpeech\":\"Adjective\",\"example\":\"A tack-free finishing gel cures shiny with no sticky layer.\",\"exampleTranslation\":\"免洗封层固化后直接发亮，没有黏黏的那层。\"},{\"id\":\"enhancements-viscosity\",\"word\":\"viscosity\",\"sayIt\":\"vis-KAH-sih-tee\",\"translation\":\"黏度\",\"partOfSpeech\":\"Noun\",\"example\":\"Viscosity is how thick or thin a gel is.\",\"exampleTranslation\":\"黏度就是胶有多稠或多稀。\"}]},{\"id\":\"7D\",\"title\":{\"en\":\"Dip Powder, Maintenance, and Removal\",\"zh\":\"浸粉、维护与卸除\"},\"cards\":[{\"id\":\"enhancements-dip-system\",\"word\":\"dip system\",\"sayIt\":\"$undefined\",\"translation\":\"浸粉系统\",\"partOfSpeech\":\"Noun\",\"example\":\"A dip system uses resin and powder to make a hard coat.\",\"exampleTranslation\":\"浸粉系统用树脂和粉在指甲上形成坚硬的涂层。\"},{\"id\":\"enhancements-dip-powder\",\"word\":\"dip powder\",\"sayIt\":\"$undefined\",\"translation\":\"浸粉\",\"partOfSpeech\":\"Noun\",\"example\":\"Dip powder is very fine and usually full of color.\",\"exampleTranslation\":\"浸粉非常细，通常颜色很浓。\"},{\"id\":\"enhancements-maintenance\",\"word\":\"maintenance\",\"sayIt\":\"MAYN-tuh-nuns\",\"translation\":\"维护\",\"partOfSpeech\":\"Noun\",\"example\":\"Liquid and powder nails need maintenance every two to three weeks.\",\"exampleTranslation\":\"水晶甲每两到三周需要维护一次。\"},{\"id\":\"enhancements-fill\",\"word\":\"fill\",\"sayIt\":\"$undefined\",\"translation\":\"补甲\",\"partOfSpeech\":\"Noun\",\"example\":\"A fill adds new product to the new growth area.\",\"exampleTranslation\":\"补甲就是在新长出的部分加上新产品。\"},{\"id\":\"enhancements-rebalance\",\"word\":\"rebalance\",\"sayIt\":\"ree-BAL-uns\",\"translation\":\"重新平衡\",\"partOfSpeech\":\"Noun\",\"example\":\"A rebalance fixes the apex so the nail stays strong.\",\"exampleTranslation\":\"重新平衡就是修整甲峰，让指甲保持坚固。\"},{\"id\":\"enhancements-ledge\",\"word\":\"ledge\",\"sayIt\":\"$undefined\",\"translation\":\"台阶\",\"partOfSpeech\":\"Noun\",\"example\":\"Smooth down the ledge at the new growth until it is flat.\",\"exampleTranslation\":\"把新长出部分的那道台阶锉平。\"},{\"id\":\"enhancements-lifting\",\"word\":\"lifting\",\"sayIt\":\"$undefined\",\"translation\":\"起翘\",\"partOfSpeech\":\"Noun\",\"example\":\"Lifting is when product pulls away from the nail.\",\"exampleTranslation\":\"起翘就是产品从指甲上翘起、脱开。\"},{\"id\":\"enhancements-paper-thin\",\"word\":\"paper-thin\",\"sayIt\":\"$undefined\",\"translation\":\"像纸一样薄\",\"partOfSpeech\":\"Adjective\",\"example\":\"Before a crack repair, file the area around it paper-thin.\",\"exampleTranslation\":\"修补裂缝前，先把裂缝周围锉到像纸一样薄。\"},{\"id\":\"enhancements-grow-out\",\"word\":\"grow out\",\"sayIt\":\"$undefined\",\"translation\":\"随指甲长出去\",\"partOfSpeech\":\"Phrase\",\"example\":\"Leave a very thin layer of hard gel to grow out.\",\"exampleTranslation\":\"留下一层很薄的硬胶，让它随指甲长出去。\"},{\"id\":\"enhancements-flake-off\",\"word\":\"flake off\",\"sayIt\":\"$undefined\",\"translation\":\"片片剥落\",\"partOfSpeech\":\"Phrase\",\"example\":\"Soaked gel polish is ready when it starts to flake off.\",\"exampleTranslation\":\"泡过的甲油胶开始片片剥落时，就可以卸了。\"}]},{\"id\":\"7E\",\"title\":{\"en\":\"Enhancement Problems and Fixes\",\"zh\":\"美甲延长常见问题与解决\"},\"cards\":[{\"id\":\"enhancements-nail-preparation\",\"word\":\"nail preparation\",\"sayIt\":\"nayl prep-uh-RAY-shun\",\"translation\":\"真甲前处理\",\"partOfSpeech\":\"Noun\",\"example\":\"Improper nail preparation is a leading cause of lifting.\",\"exampleTranslation\":\"真甲前处理不到位，是起翘的主要原因。\"},{\"id\":\"enhancements-excessive\",\"word\":\"excessive\",\"sayIt\":\"ek-SES-iv\",\"translation\":\"过度的\",\"partOfSpeech\":\"Adjective\",\"example\":\"If lifting is excessive, soak off the enhancement and start fresh.\",\"exampleTranslation\":\"如果起翘太严重，就把美甲泡掉，重新做。\"},{\"id\":\"enhancements-heat-spike\",\"word\":\"heat spike\",\"sayIt\":\"$undefined\",\"translation\":\"烫手感\",\"partOfSpeech\":\"Noun\",\"example\":\"Curing a lot of gel at once can cause a heat spike.\",\"exampleTranslation\":\"一次固化太多胶，会突然发烫（烫手感）。\"},{\"id\":\"enhancements-over-filing\",\"word\":\"over-filing\",\"sayIt\":\"$undefined\",\"translation\":\"过度锉磨\",\"partOfSpeech\":\"Noun\",\"example\":\"Over-filing makes the nail plate too thin and weak.\",\"exampleTranslation\":\"过度锉磨会让甲板变得太薄、太弱。\"},{\"id\":\"enhancements-under-cured\",\"word\":\"under-cured\",\"sayIt\":\"un-der-KYOORD\",\"translation\":\"固化不完全\",\"partOfSpeech\":\"Adjective\",\"example\":\"Under-cured gel can cause allergic skin reactions.\",\"exampleTranslation\":\"固化不完全的光疗胶可能引起皮肤过敏反应。\"},{\"id\":\"enhancements-chemical-imbalance\",\"word\":\"chemical imbalance\",\"sayIt\":\"KEM-ih-kul im-BAL-uns\",\"translation\":\"化学失衡\",\"partOfSpeech\":\"Noun\",\"example\":\"Mixing product lines can cause a chemical imbalance and allergies.\",\"exampleTranslation\":\"混用不同的产品线可能造成化学失衡，导致过敏。\"},{\"id\":\"enhancements-custom-blend\",\"word\":\"custom-blend\",\"sayIt\":\"KUS-tum blend\",\"translation\":\"自己调配\",\"partOfSpeech\":\"Verb\",\"example\":\"Never custom-blend your own gel products; it can cause allergies.\",\"exampleTranslation\":\"不要自己调配光疗胶产品，这可能导致过敏。\"},{\"id\":\"enhancements-refer\",\"word\":\"refer\",\"sayIt\":\"rih-FUR\",\"translation\":\"建议就医\",\"partOfSpeech\":\"Verb\",\"example\":\"A yellow-green nail spot? Refer the client to a doctor.\",\"exampleTranslation\":\"指甲上有黄绿色斑点？要建议客人去看医生。\"},{\"id\":\"enhancements-c-curve\",\"word\":\"C-curve\",\"sayIt\":\"$undefined\",\"translation\":\"C 弧\",\"partOfSpeech\":\"Noun\",\"example\":\"The C-curve gives the nail strength, like the curve of an egg.\",\"exampleTranslation\":\"C 弧让指甲更坚固，就像鸡蛋的弧形一样。\"}]},{\"id\":\"7F\",\"title\":{\"en\":\"More Key Facts\",\"zh\":\"更多重点\"},\"cards\":[{\"id\":\"enhancements-full-well-tip\",\"word\":\"full-well tip\",\"sayIt\":\"$undefined\",\"translation\":\"全凹槽甲片\",\"partOfSpeech\":\"Noun\",\"example\":\"A full-well tip covers more than half the nail plate.\",\"exampleTranslation\":\"全凹槽甲片通常盖住超过一半的甲面。\"},{\"id\":\"enhancements-free-margin\",\"word\":\"free margin\",\"sayIt\":\"$undefined\",\"translation\":\"空隙\",\"partOfSpeech\":\"Noun\",\"example\":\"Leave a tiny free margin between product and skin.\",\"exampleTranslation\":\"产品和皮肤之间要留一条很小的空隙。\"},{\"id\":\"enhancements-wet-bead\",\"word\":\"wet bead\",\"sayIt\":\"$undefined\",\"translation\":\"湿球\",\"partOfSpeech\":\"Noun\",\"example\":\"A wet bead has twice as much liquid as powder.\",\"exampleTranslation\":\"湿球里的液体是粉的两倍。\"},{\"id\":\"enhancements-ema\",\"word\":\"EMA\",\"sayIt\":\"ee-em-AY\",\"translation\":\"甲基丙烯酸乙酯\",\"partOfSpeech\":\"Noun\",\"example\":\"EMA is an industry standard monomer for liquid and powder.\",\"exampleTranslation\":\"EMA 是水晶甲单体液的行业标准之一。\"},{\"id\":\"enhancements-activator\",\"word\":\"activator\",\"sayIt\":\"AK-tih-vay-ter\",\"translation\":\"激活剂\",\"partOfSpeech\":\"Noun\",\"example\":\"Activator helps the layers of dip powder dry.\",\"exampleTranslation\":\"激活剂帮助浸粉的各层变干。\"},{\"id\":\"enhancements-top-resin\",\"word\":\"top resin\",\"sayIt\":\"$undefined\",\"translation\":\"封层树脂\",\"partOfSpeech\":\"Noun\",\"example\":\"Top resin is the shiny last coat on a dip nail.\",\"exampleTranslation\":\"封层树脂是浸粉甲最后那层亮亮的涂层。\"},{\"id\":\"enhancements-residue\",\"word\":\"residue\",\"sayIt\":\"REZ-ih-doo\",\"translation\":\"残留物\",\"partOfSpeech\":\"Noun\",\"example\":\"Buff gently with a fine-grit buffer to remove residue.\",\"exampleTranslation\":\"用细目抛光条轻轻抛，
