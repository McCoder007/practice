"manicure-pedicure-squoval\",\"word\":\"squoval\",\"sayIt\":\"SKWOH-vul\",\"translation\":\"方圆形\",\"partOfSpeech\":\"Noun\",\"example\":\"A squoval nail has a square free edge with rounded corners.\",\"exampleTranslation\":\"方圆形指甲的游离缘是方的，两个角是圆的。\"},{\"id\":\"manicure-pedicure-oval\",\"word\":\"oval\",\"sayIt\":\"$undefined\",\"translation\":\"椭圆形\",\"partOfSpeech\":\"Noun\",\"example\":\"An oval nail is like squoval, with even rounder corners.\",\"exampleTranslation\":\"椭圆形指甲像方圆形，但两个角更圆。\"},{\"id\":\"manicure-pedicure-conservative\",\"word\":\"conservative\",\"sayIt\":\"kun-SUR-vuh-tiv\",\"translation\":\"保守\",\"partOfSpeech\":\"Adjective\",\"example\":\"Oval is a conservative shape, thought to look good on most hands.\",\"exampleTranslation\":\"椭圆形是一种保守的甲形，被认为适合大多数人的手。\"},{\"id\":\"manicure-pedicure-stiletto\",\"word\":\"stiletto\",\"sayIt\":\"stih-LET-oh\",\"translation\":\"尖形\",\"partOfSpeech\":\"Noun\",\"example\":\"A stiletto nail is long and pointed, and may break more easily.\",\"exampleTranslation\":\"尖形（stiletto）指甲又长又尖，比较容易断。\"},{\"id\":\"manicure-pedicure-buff\",\"word\":\"buff\",\"sayIt\":\"$undefined\",\"translation\":\"抛光\",\"partOfSpeech\":\"Verb\",\"example\":\"Buff the nails to smooth out scratches and give them shine.\",\"exampleTranslation\":\"抛光指甲，磨平划痕，让指甲有光泽。\"},{\"id\":\"manicure-pedicure-waterless-manicure\",\"word\":\"waterless manicure\",\"sayIt\":\"$undefined\",\"translation\":\"无水修手\",\"partOfSpeech\":\"Noun\",\"example\":\"A waterless manicure has no water soak for the nails.\",\"exampleTranslation\":\"无水修手不用水浸泡指甲。\"},{\"id\":\"manicure-pedicure-heated-mitts\",\"word\":\"heated mitts\",\"sayIt\":\"$undefined\",\"translation\":\"电热手套\",\"partOfSpeech\":\"Noun\",\"example\":\"Lotion and heated mitts can soften the skin instead of water.\",\"exampleTranslation\":\"可以用乳液和电热手套代替水来软化皮肤。\"}]},{\"id\":\"6B\",\"title\":{\"en\":\"Massage\",\"zh\":\"按摩\"},\"cards\":[{\"id\":\"manicure-pedicure-effleurage\",\"word\":\"effleurage\",\"sayIt\":\"ef-loo-RAHZH\",\"translation\":\"轻抚法\",\"partOfSpeech\":\"Noun\",\"example\":\"In effleurage, the hands glide over the skin.\",\"exampleTranslation\":\"做轻抚法时，双手在皮肤上滑动。\"},{\"id\":\"manicure-pedicure-p-trissage\",\"word\":\"pétrissage\",\"sayIt\":\"$undefined\",\"translation\":\"揉捏法\",\"partOfSpeech\":\"Noun\",\"example\":\"Pétrissage means kneading: you lift, squeeze, and press.\",\"exampleTranslation\":\"揉捏法就是揉：抓起、挤压、按下。\"},{\"id\":\"manicure-pedicure-tapotement\",\"word\":\"tapotement\",\"sayIt\":\"tuh-POHT-ment\",\"translation\":\"叩击法\",\"partOfSpeech\":\"Noun\",\"example\":\"Tapotement is fast tapping with the hands on the skin.\",\"exampleTranslation\":\"叩击法是用手在皮肤上快速拍打。\"},{\"id\":\"manicure-pedicure-vibration\",\"word\":\"vibration\",\"sayIt\":\"vy-BRAY-shun\",\"translation\":\"振动法\",\"partOfSpeech\":\"Noun\",\"example\":\"In vibration, the hand shakes but never leaves the skin.\",\"exampleTranslation\":\"振动法中，手一直抖动，但不离开皮肤。\"},{\"id\":\"manicure-pedicure-friction\",\"word\":\"friction\",\"sayIt\":\"$undefined\",\"translation\":\"摩擦法\",\"partOfSpeech\":\"Noun\",\"example\":\"Friction rubs or presses one layer of tissue over another.\",\"exampleTranslation\":\"摩擦法是把一层组织在另一层上搓动或按压。\"},{\"id\":\"manicure-pedicure-relaxation\",\"word\":\"relaxation\",\"sayIt\":\"ree-lak-SAY-shun\",\"translation\":\"放松\",\"partOfSpeech\":\"Noun\",\"example\":\"The goal of massage in a manicure is relaxation.\",\"exampleTranslation\":\"修手中按摩的目的是让顾客放松。\"},{\"id\":\"manicure-pedicure-vigorous\",\"word\":\"vigorous\",\"sayIt\":\"VIG-er-us\",\"translation\":\"剧烈\",\"partOfSpeech\":\"Adjective\",\"example\":\"Do not use vigorous, strong massage on clients with arthritis.\",\"exampleTranslation\":\"顾客有关节炎时，不要用剧烈、用力的按摩手法。\"},{\"id\":\"manicure-pedicure-arthritis\",\"word\":\"arthritis\",\"sayIt\":\"ar-THRY-tis\",\"translation\":\"关节炎\",\"partOfSpeech\":\"Noun\",\"example\":\"Arthritis can make joints painful. Never press right on the joints.\",\"exampleTranslation\":\"关节炎会让关节疼痛。绝不要直接按压关节。\"},{\"id\":\"manicure-pedicure-skin-drag\",\"word\":\"skin drag\",\"sayIt\":\"$undefined\",\"translation\":\"皮肤拖拽\",\"partOfSpeech\":\"Noun\",\"example\":\"Skin drag happens when there is too little lotion on the skin.\",\"exampleTranslation\":\"皮肤上的乳液太少时，就会出现皮肤拖拽。\"},{\"id\":\"manicure-pedicure-feathering-off\",\"word\":\"feathering off\",\"sayIt\":\"$undefined\",\"translation\":\"羽毛式收尾\",\"partOfSpeech\":\"Noun\",\"example\":\"Feathering off is the light stroke that ends the massage.\",\"exampleTranslation\":\"羽毛式收尾是结束按摩时的轻柔手法。\"},{\"id\":\"manicure-pedicure-ticklish\",\"word\":\"ticklish\",\"sayIt\":\"$undefined\",\"translation\":\"怕痒\",\"partOfSpeech\":\"Adjective\",\"example\":\"Hold the foot firmly. A light, loose hold can feel ticklish.\",\"exampleTranslation\":\"要稳稳地握住脚。握得太轻太松会让人觉得痒。\"}]},{\"id\":\"6C\",\"title\":{\"en\":\"Pedicure Care\",\"zh\":\"足部护理（修脚）\"},\"cards\":[{\"id\":\"manicure-pedicure-callus\",\"word\":\"callus\",\"sayIt\":\"KAL-us\",\"translation\":\"老茧\",\"partOfSpeech\":\"Noun\",\"example\":\"A callus is thick skin that protects the skin under it.\",\"exampleTranslation\":\"老茧是一层厚皮，保护下面的皮肤。\"},{\"id\":\"manicure-pedicure-ingrown-toenail\",\"word\":\"ingrown toenail\",\"sayIt\":\"$undefined\",\"translation\":\"嵌甲\",\"partOfSpeech\":\"Noun\",\"example\":\"An ingrown toenail grows into the skin beside the nail.\",\"exampleTranslation\":\"嵌甲就是脚趾甲长进旁边的皮肤里。\"},{\"id\":\"manicure-pedicure-podiatrist\",\"word\":\"podiatrist\",\"sayIt\":\"puh-DY-uh-trist\",\"translation\":\"足科医生\",\"partOfSpeech\":\"Noun\",\"example\":\"A podiatrist is a foot doctor who can treat ingrown nails.\",\"exampleTranslation\":\"足科医生是看脚的医生，可以治疗嵌甲。\"},{\"id\":\"manicure-pedicure-callus-shaver\",\"word\":\"callus shaver\",\"sayIt\":\"$undefined\",\"translation\":\"去茧刀\",\"partOfSpeech\":\"Noun\",\"example\":\"Never use a razor-type callus shaver. Calluses grow back heavier.\",\"exampleTranslation\":\"绝不要用剃刀式去茧刀。老茧会长得更厚。\"},{\"id\":\"manicure-pedicure-tremors\",\"word\":\"tremors\",\"sayIt\":\"$undefined\",\"translation\":\"颤抖\",\"partOfSpeech\":\"Noun\",\"example\":\"Tremors are shaking movements that a client cannot control.\",\"exampleTranslation\":\"颤抖是顾客控制不住的抖动。\"},{\"id\":\"manicure-pedicure-exfoliate\",\"word\":\"exfoliate\",\"sayIt\":\"eks-FOH-lee-ayt\",\"translation\":\"去角质\",\"partOfSpeech\":\"Verb\",\"example\":\"Exfoliate the foot with a scrub to remove dry, scaly skin.\",\"exampleTranslation\":\"用磨砂膏给脚去角质，去掉干燥脱屑的皮肤。\"},{\"id\":\"manicure-pedicure-chronic-illness\",\"word\":\"chronic illness\",\"sayIt\":\"KRAH-nik IL-nus\",\"translation\":\"慢性病\",\"partOfSpeech\":\"Noun\",\"example\":\"Do not use metal pushers on clients with a chronic illness.\",\"exampleTranslation\":\"顾客有慢性病时，不要用金属推棒。\"},{\"id\":\"manicure-pedicure-urea\",\"word\":\"urea\",\"sayIt\":\"yoo-REE-uh\",\"translation\":\"尿素\",\"partOfSpeech\":\"Noun\",\"example\":\"Soak with a urea softener before cleaning buildup between toes.\",\"exampleTranslation\":\"清理脚趾间的积垢前，先用含尿素的软化产品浸泡。\"},{\"id\":\"manicure-pedicure-microtrauma\",\"word\":\"microtrauma\",\"sayIt\":\"my-kroh-TRAW-muh\",\"translation\":\"微创伤\",\"partOfSpeech\":\"Noun\",\"example\":\"Microtrauma is tiny, unseen openings in the skin, like shaving scrapes.\",\"exampleTranslation\":\"微创伤是皮肤上看不见的细小开口，例如刮腿毛留下的刮痕。\"},{\"id\":\"manicure-pedicure-spa-pedicure\",\"word\":\"spa pedicure\",\"sayIt\":\"$undefined\",\"translation\":\"水疗修脚\",\"partOfSpeech\":\"Noun\",\"example\":\"A spa pedicure takes longer and includes a leg massage.\",\"exampleTranslation\":\"水疗修脚时间更长，还包括腿部按摩。\"},{\"id\":\"manicure-pedicure-scaly\",\"word\":\"scaly\",\"sayIt\":\"$undefined\",\"translation\":\"脱屑\",\"partOfSpeech\":\"Adjective\",\"example\":\"Scaly feet may mean fungus, so a podiatrist must check first.\",\"exampleTranslation\":\"脚部脱屑可能是真菌感染，所以必须先让足科医生检查。\"},{\"id\":\"manicure-pedicure-dry-pedicure\",\"word\":\"dry pedicure\",\"sayIt\":\"$undefined\",\"translation\":\"干式修脚\",\"partOfSpeech\":\"Noun\",\"example\":\"In a dry pedicure, you still shape the nails and apply lotion.\",\"exampleTranslation\":\"做干式修脚时，你照样要修甲形、涂乳液。\"}]},{\"id\":\"6D\",\"title\":{\"en\":\"Polish and Add-On Services\",\"zh\":\"上甲油与附加服务\"},\"cards\":[{\"id\":\"manicure-pedicure-base-coat\",\"word\":\"base coat\",\"sayIt\":\"$undefined\",\"translation\":\"底油\",\"partOfSpeech\":\"Noun\",\"example\":\"A base coat stops stains and helps colored polish stick.\",\"exampleTranslation\":\"底油能防止染色，并帮助彩色甲油附着。\"},{\"id\":\"manicure-pedicure-three-stroke-method\",\"word\":\"three-stroke method\",\"sayIt\":\"$undefined\",\"translation\":\"三笔涂法\",\"partOfSpeech\":\"Noun\",\"example\":\"The three-stroke method uses one stroke down the middle, one each side.\",\"exampleTranslation\":\"三笔涂法是中间往下涂一笔，两侧各涂一笔。\"},{\"id\":\"manicure-pedicure-capping\",\"word\":\"capping\",\"sayIt\":\"$undefined\",\"translation\":\"包边\",\"partOfSpeech\":\"Noun\",\"example\":\"Capping seals the free edge with polish and reduces chipping.\",\"exampleTranslation\":\"包边就是用甲油封住游离缘，减少剥落。\"},{\"id\":\"manicure-pedicure-dominant-hand\",\"word\":\"dominant hand\",\"sayIt\":\"DOM-ih-nunt hand\",\"translation\":\"惯用手\",\"partOfSpeech\":\"Noun\",\"example\":\"Start with the dominant hand, the hand the client uses most.\",\"exampleTranslation\":\"先从惯用手开始，也就是顾客最常用的那只手。\"},{\"id\":\"manicure-pedicure-french-manicure\",\"word\":\"French manicure\",\"sayIt\":\"$undefined\",\"translation\":\"法式美甲\",\"partOfSpeech\":\"Noun\",\"example\":\"A traditional French manicure often has a pink nail and white tip.\",\"exampleTranslation\":\"传统法式美甲通常是粉色指甲配白色指尖。\"},{\"id\":\"manicure-pedicure-smile-line\",\"word\":\"smile line\",\"sayIt\":\"$undefined\",\"translation\":\"微笑线\",\"partOfSpeech\":\"Noun\",\"example\":\"The smile line is the curve where the pink and white meet.\",\"exampleTranslation\":\"微笑线是粉色和白色交界的那条弧线。\"},{\"id\":\"manicure-pedicure-marbleizing\",\"word\":\"marbleizing\",\"sayIt\":\"MAR-bul-eye-zing\",\"translation\":\"大理石纹\",\"partOfSpeech\":\"Noun\",\"example\":\"Marbleizing swirls wet colors together with a stylus.\",\"exampleTranslation\":\"大理石纹是用点花笔把未干的几种颜色搅成漩涡。\"},{\"id\":\"manicure-pedicure-stylus\",\"word\":\"stylus\",\"sayIt\":\"STY-lus\",\"translation\":\"点花笔\",\"partOfSpeech\":\"Noun\",\"example\":\"A stylus has a round ball tip on each end.\",\"exampleTranslation\":\"点花笔的两端各有一个圆球头。\"},{\"id\":\"manicure-pedicure-paraffin-wax-treatment\",\"word\":\"paraffin wax treatment\",\"sayIt\":\"PAIR-uh-fin waks TREET-ment\",\"translation\":\"蜡疗\",\"partOfSpeech\":\"Noun\",\"example\":\"A paraffin wax treatment traps moisture in the skin.\",\"exampleTranslation\":\"蜡疗能把水分锁在皮肤里。\"},{\"id\":\"manicure-pedicure-impaired-circulation\",\"word\":\"impaired circulation\",\"sayIt\":\"im-PAIRD sur-kyuh-LAY-shun\",\"translation\":\"血液循环不良\",\"partOfSpeech\":\"Noun\",\"example\":\"Avoid paraffin for clients with impaired circulation (poor blood flow).\",\"exampleTranslation\":\"血液循环不良（血流不好）的顾客，要避免做蜡疗。\"},{\"id\":\"manicure-pedicure-heat-tolerance\",\"word\":\"heat tolerance\",\"sayIt\":\"heet TOL-er-uns\",\"translation\":\"耐热度\",\"partOfSpeech\":\"Noun\",\"example\":\"Test heat tolerance with a small patch of wax on the skin.\",\"exampleTranslation\":\"在皮肤上滴一小片蜡，测试顾客的耐热度。\"},{\"id\":\"manicure-pedicure-hot-stone-pedicure\",\"word\":\"hot stone pedicure\",\"sayIt\":\"$undefined\",\"translation\":\"热石修脚\",\"partOfSpeech\":\"Noun\",\"example\":\"In a hot stone pedicure, the stones are warm, not hot.\",\"exampleTranslation\":\"热石修脚中，石头是温暖的，并不烫。\"}]}],\"storageKey\":\"exam-topic-words-manicure-pedicure\",\"backHref\":\"/nail-exam-practice/exam-topics/manicure-pedicure\",\"backTitle\":{\"en\":\"Manicure and Pedicure Services\",\"zh\":\"手部与足部护理服务\"}}]\n"])</script><script>self.__next_f.push([1,"11:null\n"])</script><script>self.__next_f.push([1,"15:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#ffffff\"}]]\n
